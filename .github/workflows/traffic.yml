name: Trafic

# Le site n'embarque aucune balise de mesure : c'est Cloudflare, déjà devant
# nitro.sterenna.fr, qui compte. Ce workflow va juste lui demander les chiffres.
# Rien n'est ajouté sur la page, rien n'est déposé chez le visiteur.
#
# Le résumé s'affiche dans l'onglet Actions, pas besoin d'ouvrir les logs.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Nombre de jours à couvrir (1 à 30)'
        required: false
        default: '7'

jobs:
  traffic:
    name: Relever le trafic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Interroger Cloudflare
        env:
          # Jeton dédié en lecture seule s'il existe. Le CLOUDFLARE_API_TOKEN de
          # l'organisation est celui de pokegang (Zone.Cache Purge uniquement) :
          # il ne peut pas lire les statistiques, et on ne l'élargit pas pour ça.
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node tools/traffic.mjs "${{ inputs.days }}"
